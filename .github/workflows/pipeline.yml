name: Python Calculator Program

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: checkout code 
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.14"
     
      - name: running calculator app
        run: python calculator.py
 
      